name: Nightly reference data
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a validated change (main branch only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: reference-data-publication
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .cache
          key: producer-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: producer-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Read previously published identities
        run: python3 scripts/releases.py previous work/previous.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
      - name: Generate complete canonical dataset
        run: cargo run --locked --release -- build --previous work/previous.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: cargo run --locked --release -- validate dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-data
          path: dist/
          retention-days: 7
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download generated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name reference-data --dir dist
      - name: Stage, verify, then promote changed dataset
        run: python3 scripts/releases.py publish dist
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
