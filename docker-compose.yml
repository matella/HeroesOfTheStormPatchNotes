services:
  api:
    build:
      context: ./src
      dockerfile: HotsPatchNotes.Api/Dockerfile
    container_name: hotspatchnotes-api
    ports:
      - "5001:5001"
      - "7001:7001"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:7001;http://+:5001
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: password
      ConnectionStrings__DefaultConnection: Data Source=/app/data/hots.db
    volumes:
      - hots-data:/app/data
      - ~/.aspnet/https:/https:ro
    networks:
      - hotspatchnotes-network
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:7001/api/heroes/roles || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ./src
      dockerfile: HotsPatchNotes.Web/Dockerfile
    container_name: hotspatchnotes-web
    ports:
      - "5100:80"
      - "7000:443"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    networks:
      - hotspatchnotes-network
    volumes:
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  hotspatchnotes-network:

volumes:
  hots-data:
